const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dec(pw){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct));
const ds=new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'));return await new Response(ds).text();}
async function openIt(pw,auto){try{const h=await dec(pw);if(!auto&&document.getElementById('rem').checked)localStorage.setItem('wrap_pub_pw',pw);document.open();document.write(h);document.close();}
catch(e){if(auto)localStorage.removeItem('wrap_pub_pw');else document.getElementById('err').textContent='비밀번호가 맞지 않습니다';}}
document.getElementById('go').onclick=()=>openIt(document.getElementById('pw').value,false);
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')openIt(e.target.value,false);});
const saved=localStorage.getItem('wrap_pub_pw');if(saved)openIt(saved,true);
